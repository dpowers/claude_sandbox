# Tagging `v<x.y.z>` publishes a GitHub release with generated notes.
#
#   # bump `version` in Cargo.toml, commit, then
#   git tag v0.2.0 && git push origin main v0.2.0
#
# Nothing here touches the Homebrew formula: it is head-only, so installs build
# whatever `main` is at and a tag is only a changelog marker. Tag or don't —
# `brew upgrade --fetch-HEAD claude-sandbox` picks up commits either way.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
